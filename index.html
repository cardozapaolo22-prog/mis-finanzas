<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sol</title>
<meta name="description" content="Tus ingresos, gastos, cuentas, préstamos, deudas y metas en un solo lugar.">
<meta name="theme-color" content="#0a1240" id="theme-color">
<link rel="manifest" href="manifest.json?v=5">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png?v=5">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=5">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sol">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // Aplica el modo y el color guardados antes de dibujar, para que no parpadee
  (function(){try{
    var t=localStorage.getItem("mf-tema")||"dark";
    document.documentElement.setAttribute("data-theme",t);
    var c=JSON.parse(localStorage.getItem("mf-hsl")||"null");
    if(c){var s=document.documentElement.style;s.setProperty("--h",c[0]);s.setProperty("--s",c[1]+"%");s.setProperty("--l",c[2]+"%");}
  }catch(e){document.documentElement.setAttribute("data-theme","dark");}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
<div class="bgfx" aria-hidden="true"></div>

<!-- Pantalla de carga -->
<div id="screen-loading" class="center-screen">
  <img class="brandlogo" src="icons/logo-160.png?v=5" alt="" width="76" height="76">
  <p class="muted">Cargando…</p>
</div>

<!-- Pantalla de ingreso -->
<div id="screen-login" class="center-screen" hidden>
  <div class="glass login-card">
    <img class="brandlogo" src="icons/logo-160.png?v=5" alt="" width="76" height="76">
    <h1 class="login-title"><span>Sol</span></h1>
    <p class="muted login-copy">Tus ingresos, gastos, cuentas, préstamos y metas, en un solo lugar.</p>
    <button class="btn big" id="btn-login">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
      Entrar con Google
    </button>
    <p class="muted small" id="login-error" role="alert"></p>
  </div>
</div>

<!-- Pantalla sin acceso -->
<div id="screen-denied" class="center-screen" hidden>
  <div class="glass login-card">
    <img class="brandlogo" src="icons/logo-160.png?v=5" alt="" width="76" height="76">
    <h1 class="login-title">Sin acceso</h1>
    <p class="muted login-copy">La cuenta <strong id="denied-email"></strong> no está en la lista de personas permitidas. Pídele a quien administra la app que agregue tu correo.</p>
    <button class="btn ghost" id="btn-logout-denied">Usar otra cuenta</button>
  </div>
</div>

<!-- App -->
<div id="screen-app" hidden>
  <header>
    <div class="wrap">
      <div class="glass bar">
        <span id="avatar" class="avatar" aria-hidden="true"></span>
        <div class="hello"><small id="hello-sub">Hola</small><strong id="hello-name">Sol</strong></div>
        <button class="iconbtn" id="btn-theme" aria-label="Cambiar a modo día o noche"></button>
        <label class="iconbtn" title="Cambiar color" aria-label="Cambiar color de la app">
          <span class="swatch" aria-hidden="true"></span>
          <input type="color" id="color-pick" aria-label="Elegir color">
        </label>
      </div>
      <nav class="glass tabs" role="tablist" id="tabs"></nav>
    </div>
  </header>
  <div class="wrap">
    <div class="monthnav" id="monthnav">
      <button class="iconbtn" id="prev" aria-label="Anterior">‹</button>
      <div class="mid"><strong id="mlabel"></strong><div class="mswitch" id="mswitch" role="group" aria-label="Ver mes o año"></div></div>
      <button class="iconbtn" id="next" aria-label="Siguiente">›</button>
    </div>
    <div class="status" id="status"></div>
    <main id="app"></main>
  </div>
</div>

<div id="layer"></div>

<script src="config.js?v=5"></script>
<script type="module" src="app.js?v=5"></script>
</body>
</html>
